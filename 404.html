<body>
  <app-root>
    <style type="text/css">
      body {
        font-family: Peyda;
        margin: 0;
        min-height: 100vh;
      }

      .app-boot-loader {
        --ip-coin-size: 92px;
        --ip-coin-depth: 10px;
        --ip-coin-front-image: none;
        --ip-coin-back-image: none;
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        color: #26323d;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0) 34%),
          radial-gradient(circle at 76% 76%, rgba(0, 147, 92, 0.14), rgba(0, 147, 92, 0) 30%),
          radial-gradient(circle at 18% 82%, rgba(250, 175, 22, 0.16), rgba(250, 175, 22, 0) 28%),
          linear-gradient(145deg, #f8fbf9 0%, #eef7f2 100%);
      }

      .app-boot-loader *,
      .app-boot-loader *::before,
      .app-boot-loader *::after {
        box-sizing: border-box;
      }

      .app-boot-loader__surface {
        width: min(100%, 320px);
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 30px 24px 26px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.62);
        border-radius: 28px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.22) 44%, rgba(255, 255, 255, 0) 70%),
          linear-gradient(145deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.58));
        box-shadow:
          0 24px 60px rgba(31, 70, 58, 0.16),
          0 8px 24px rgba(31, 70, 58, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.76);
        backdrop-filter: blur(24px) saturate(175%);
        -webkit-backdrop-filter: blur(24px) saturate(175%);
      }

      .app-coin-loader {
        width: calc(var(--ip-coin-size) + 18px);
        height: calc(var(--ip-coin-size) + 18px);
        display: grid;
        place-items: center;
        position: relative;
        margin-bottom: 4px;
        perspective: 760px;
      }

      .app-coin-loader::after {
        content: '';
        position: absolute;
        width: 76px;
        height: 12px;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(36, 58, 52, 0.16);
        filter: blur(8px);
      }

      .app-coin-loader__coin {
        width: var(--ip-coin-size);
        height: var(--ip-coin-size);
        position: relative;
        transform-style: preserve-3d;
        animation: ipCoinSpin 1.8s linear infinite;
      }

      .app-coin-loader__edge,
      .app-coin-loader__face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .app-coin-loader__edge {
        inset: -5px;
        background:
          repeating-conic-gradient(from 10deg, #c88a13 0 7deg, #ffe08a 7deg 12deg, #9f6710 12deg 18deg),
          radial-gradient(circle, #f7c95d 0%, #b87913 72%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 245, 186, 0.62),
          inset 0 0 16px rgba(105, 66, 4, 0.28),
          0 16px 28px rgba(137, 93, 16, 0.18);
        transform: translateZ(0);
      }

      .app-coin-loader__face {
        z-index: 1;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(137, 94, 16, 0.36);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        box-shadow:
          inset 0 2px 10px rgba(255, 249, 202, 0.72),
          inset 0 -10px 18px rgba(128, 82, 9, 0.24);
      }

      /* To replace coin faces later:
         set --ip-coin-front-image: url('/path/to/front.svg');
         set --ip-coin-back-image: url('/path/to/back.svg');
      */
      .app-coin-loader__face--front {
        transform: translateZ(calc(var(--ip-coin-depth) / 2));
        background-image:
          var(--ip-coin-front-image),
          radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0) 26%),
          radial-gradient(circle at 50% 50%, rgba(255, 230, 142, 0.95), rgba(226, 160, 36, 0.96) 58%, rgba(169, 108, 16, 0.98) 100%);
        background-size: 58%, auto, auto;
        background-repeat: no-repeat;
        background-position: center;
      }

      .app-coin-loader__face--back {
        transform: rotateY(180deg) translateZ(calc(var(--ip-coin-depth) / 2));
        background-image:
          var(--ip-coin-back-image),
          radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0) 28%),
          conic-gradient(from 120deg, #e7b644, #fff1ad, #bd7d12, #f2ca67, #e7b644);
        background-size: 56%, auto, auto;
        background-repeat: no-repeat;
        background-position: center;
      }

      .app-coin-loader__mark {
        width: 62%;
        height: 62%;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #0f6b4f;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0;
        background:
          radial-gradient(circle at 50% 26%, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0) 48%),
          rgba(255, 255, 255, 0.26);
        border: 1px solid rgba(255, 255, 255, 0.38);
        box-shadow: inset 0 0 0 1px rgba(13, 98, 72, 0.12);
      }

      .app-coin-loader__mark--back {
        color: #8a5b0d;
        font-size: 26px;
      }

      .app-boot-loader__title {
        margin: 4px 0 0;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.8;
        color: #26323d;
      }

      .app-boot-loader__subtitle {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.7;
        color: #66727d;
      }

      @keyframes ipCoinSpin {
        0% {
          transform: rotateY(0deg) rotateX(0deg);
        }

        100% {
          transform: rotateY(360deg) rotateX(0deg);
        }
      }

      @keyframes ipCoinPulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.04);
        }

        100% {
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-coin-loader__coin {
          animation: ipCoinPulse 1.8s ease-in-out infinite;
        }
      }

      @media (max-width: 420px) {
        .app-boot-loader {
          --ip-coin-size: 82px;
          padding: 24px 16px;
        }

        .app-boot-loader__surface {
          border-radius: 24px;
          padding: 26px 20px 22px;
        }
      }
    </style>
    <div class="app-boot-loader" role="status" aria-live="polite" dir="rtl">
      <div class="app-boot-loader__surface">
        <div class="app-coin-loader" aria-hidden="true">
          <div class="app-coin-loader__coin">
            <span class="app-coin-loader__edge"></span>
            <span class="app-coin-loader__face app-coin-loader__face--front">
              <span class="app-coin-loader__mark">IP</span>
            </span>
            <span class="app-coin-loader__face app-coin-loader__face--back">
              <span class="app-coin-loader__mark app-coin-loader__mark--back">پ</span>
            </span>
          </div>
        </div>
        <p class="app-boot-loader__title">در حال آماده‌سازی آی‌پاسارگاد...</p>
        <p class="app-boot-loader__subtitle">لطفاً چند لحظه صبر کنید</p>
      </div>
    </div>

  </app-root>
