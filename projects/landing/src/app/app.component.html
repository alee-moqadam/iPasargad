<!-- Header -->
<div class="header-container">
  <div class="mobile-menu" *ngIf="showMobileMenu">
    <div class="d-flex flex-column w-100">
      <div class="menu-mobile-toggle mb-2 me-auto text-secondary" (click)="toggleMenu()">
        <fa-icon class="d-flex" icon="times" size="lg"></fa-icon>
      </div>
      <a (click)="toggleMenu()" routerLink="/" class="text-decoration-none mb-4">
        <img height="60px" src="/images/logo-only.svg" alt="logo" />
      </a>
      <nav class="mobile-nav">
        <a href="https://app.ipasargad.ir/auth/login" class="nav-link fs-2 fs-3 mb-3 ff-peyda">ورود</a>
        <a href="https://app.ipasargad.ir/auth/reg/step1" class="nav-link fs-3 mb-3 ff-peyda">ثبت نام</a>
        <a (click)="toggleMenu()" [routerLink]="['/contact-us']" class="nav-link fs-3 mb-3 ff-peyda">تماس با ما</a>
        <a (click)="toggleMenu()" [routerLink]="['/about-us']" class="nav-link fs-3 mb-2 ff-peyda">درباره ما</a>
      </nav>
    </div>
  </div>
</div>
