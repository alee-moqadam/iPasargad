<div class="d-flex flex-column justify-content-center align-items-center">
  <div class="d-flex">
    <span class="key-button" appKeyboardKey="q 1 ["></span>
    <span class="key-button" appKeyboardKey="w 2 ]"></span>
    <span class="key-button" appKeyboardKey="e 3 {"></span>
    <span class="key-button" appKeyboardKey="r 4 }"></span>
    <span class="key-button" appKeyboardKey="t 5 #"></span>
    <span class="key-button" appKeyboardKey="y 6 %"></span>
    <span class="key-button" appKeyboardKey="u 7 ^"></span>
    <span class="key-button" appKeyboardKey="i 8 *"></span>
    <span class="key-button" appKeyboardKey="o 9 +"></span>
    <span class="key-button" appKeyboardKey="p 0 ="></span>
  </div>
  <div class="d-flex">
    <span class="key-button" appKeyboardKey="a - _"></span>
    <span class="key-button" appKeyboardKey="s / \"></span>
    <span class="key-button" appKeyboardKey="d : |"></span>
    <span class="key-button" appKeyboardKey="f ; ~"></span>
    <span class="key-button" appKeyboardKey="g ( &lt;"></span>
    <span class="key-button" appKeyboardKey="h ) &gt;"></span>
    <span class="key-button" appKeyboardKey="j $ &euro;"></span>
    <span class="key-button" appKeyboardKey="k & &pound;"></span>
    <span class="key-button" appKeyboardKey="l @ &yen;"></span>
  </div>
  <div class="d-flex">
    <span class="key-button special" (click)="onShift()" [class.toggled]="keyboard.shift">{{ keyboard.alt ? '#+=' :
      'Shift'}}</span>
    <span class="key-button" appKeyboardKey="z &quot; &quot;"></span>
    <span class="key-button" appKeyboardKey="x . ."></span>
    <span class="key-button" appKeyboardKey="c , ,"></span>
    <span class="key-button" appKeyboardKey="v ? ?"></span>
    <span class="key-button" appKeyboardKey="b ! !"></span>
    <span class="key-button" appKeyboardKey="n ' '"></span>
    <span class="key-button" appKeyboardKey="m ` `"></span>
    <span class="key-button special" (click)="onBackspace()">Del</span>
  </div>
  <div class="d-flex">
    <span class="key-button special" (click)="onAlt()">{{ keyboard.alt ? 'ABC' : '123'}}</span>
    <span class="key-button spacebar" appKeyboardKey="&nbsp; &nbsp; &nbsp;"></span>
    <span class="key-button special wide" (click)="onEnter()">Enter</span>
  </div>
</div>
