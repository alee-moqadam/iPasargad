<div class="modal-header p-1 m-0 align-items-center overflow-hidden d-flex justify-content-between" 
    style="border-bottom: var(--dtx-gray-250) solid 1px;background-color: aliceblue;border-top-left-radius: 30px;border-top-right-radius: 30px;">
  <div class="d-flex">
    <fa-icon icon="{{notificationType == 2 ? 'warning' : 'info-circle'}}" class="{{notificationType == 2 ? 'text-warning' : 'text-info'}} me-3"></fa-icon> 
    <h4 class="text-secondary px-2 mt-3 font-weight-light">{{title}}</h4>
  </div> 
  <button (click)="closeModal()" type="button" class="btn btn-neutral pe-5 rounded-0 text-dark">
    <svg viewBox="0 0 24 24" width="23" height="23" stroke-width="1px">
     <use xlink:href="#ico_close"></use>
    </svg>
  </button>
</div>
<div class="modal-body p-0 text-justify">
  <div class="mb-0 px-4 py-4 bg-white d-flex flex-column flex-grow-1 form-group">
    <h4 class="" style="line-height: 1.5;" [innerHtml]="message"></h4>
    <h6 class="d-flex m-0 justify-content-end text-muted font-weight-light">
        {{(createDate | persianDatetime : 'YYYY/MM/DD - HH:mm:ss').split('-')[1]}}
        <span class="mx-1">-</span>
        {{(createDate | persianDatetime : 'YYYY/MM/DD - HH:mm:ss').split('-')[0]}}        
    </h6>
  </div>
</div>
<div class="modal-footer p-2 border-1">

  <div class="w-100 d-flex justify-content-center">
    <button class="btn w-50 mx-3 btn-primary" (click)="confirm()">
      تایید
    </button>
    @if(!isMessage){
    <button class="btn w-50 mx-3 btn-secondary text-white" (click)="closeModal()">
      انصراف
    </button>
    }

  </div>
</div>
