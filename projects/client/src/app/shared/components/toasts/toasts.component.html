  @if(toast?.type){
    <ngb-toast
      *ngIf="toast.show"
      class="w-100 mb-2"
      [class]="toast.classname"
      [autohide]="false"
      [delay]="toast.delay || 5000"
      (hidden)="toast.show = false; toastService.remove(toast)">
      <ng-template [ngIf]="isTemplate(toast)" [ngIfElse]="text">
        <ng-template [ngTemplateOutlet]="toast.textOrTpl"></ng-template>
      </ng-template>
      <ng-template #text>
        <div class="d-flex justify-content-between align-items-center" (click)="closeToast(toast)">
          <div>
            <!-- Toast message or content -->
            {{ toast.textOrTpl }}
          </div>
          <button
            type="button"
            class="btn p-1 text-white ms-2"
            aria-label="Close"
          >
            <fa-icon [icon]="['fas', 'times']"></fa-icon>
          </button>
        </div>
      </ng-template>
    </ngb-toast>
      }@else {
        <ngb-toast
      *ngIf="toast.show"
      class="w-100 mb-2"
      [class]="toast.classname"
      [autohide]="true"
      [delay]="toast.delay || 5000"
      (hidden)="toast.show = false; toastService.remove(toast)">
      <ng-template [ngIf]="isTemplate(toast)" [ngIfElse]="text">
        <ng-template [ngTemplateOutlet]="toast.textOrTpl"></ng-template>
      </ng-template>
      <ng-template #text>
        <div class="d-flex justify-content-between align-items-center" (click)="closeToast(toast)">
          <div>
            <!-- Toast message or content -->
            {{ toast.textOrTpl }}
          </div>
          <button
            type="button"
            class="btn p-1 text-white ms-2"
            aria-label="Close"
          >
            <fa-icon [icon]="['fas', 'times']"></fa-icon>
          </button>
        </div>
      </ng-template>
    </ngb-toast>
  }
}
