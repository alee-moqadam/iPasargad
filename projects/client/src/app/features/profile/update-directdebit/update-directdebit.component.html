<div class="card bg-gray-300">
  <div class="card-body">
    <button type="button" class="btn-close me-2 mb-2" aria-label="Close"
      (click)="activeModal.dismiss('Cross click')"></button>

    <div class="text-center mb-3 p-3">
      <img src="/svg/podLogoMark.svg" class="img-fluid" alt="" />
    </div>
    <div class="bg-gray-275 text-center py-2 mb-3">فعالسازی پرداخت مستقیم</div>

    <form [formGroup]="formGroup" (ngSubmit)="submit()" dir="rtl">
      <div class="mb-3" [style.display]="step == 'step1' ? 'block' : 'none'">
        <label for="" class="form-text text-muted small">
          برای دریافت اطلاعات شما از سامانه پاد بانک پاسارگاد لطفا مقدار زیر را
          وارد نمایید
        </label>
        <div class="form-group">
          <label for="mobile" class="form-text text-muted small mb-4">
            شماره تلفن ثبت شده در سامانه پاد را وارد نمایید
          </label>
          <input class="form-control" id="mobile" type="text" formControlName="mobile" inputmode="decimal"
            mask="00000000000" />
        </div>
      </div>

      <div [style.display]="step == 'step2' ? 'block' : 'none'" class="form-group mb-3">
        <label for="" class="form-text text-muted small mb-3">
          کد تایید به شماره ثبت شده ارسال می‌شود
        </label>
        <input class="form-control" id="otp" type="text" formControlName="otp" inputmode="decimal" mask="000000" />
      </div>

      @if(errMsg()){
      <div class="my-4">
        <p class="text-danger text-center mb-0">* {{ errMsg() }}</p>
      </div>
      }
      <div class="d-flex flex mb-4">
        <app-loading-button class="flex-fill my-2" [isLoading]="submitting()" [disabled]="submitting()"
          [type]="'submit'" cssClass="btn btn-primary">
          فعالسازی پرداخت مستقیم
        </app-loading-button>

      </div>
    </form>
  </div>
</div>
