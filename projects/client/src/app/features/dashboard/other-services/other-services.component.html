<div class="d-flex justify-content-between align-items-center mt-5 mb-3">
  <h4 class="text-secondary m-0">سایر خدمات</h4>

</div>
<div class="card mb-6" style="border-radius: 15px;">
  <div class="card-body d-flex align-items-center justify-content-between w-100">
    <!-- <fa-icon icon="angle-left"></fa-icon> -->
    <div class="d-flex align-items-center justify-content-between w-100">
      <div class="d-flex align-items-center">
        <img class="ms-3" src="images/pasargad-logo.png" alt="iran kish logo" height="30px" width="30px" />
        <div class="d-flex flex-column">
          <h5 class="mb-0 font-weight-semi" style="color: #46503C;">پرداخت مستقیم پاسارگاد </h5>
          <h6 class="w-100 mt-2" style="color: #828C96;">
            پرداخت سریع برای سرمایه‌گذاری، با یک کلیک و بدون نیاز به درگاه.
  
          </h6>
        </div>
      </div>
      <div class="d-flex align-items-center">
        @if (customerInfo()?.podSsoInfo === null) {
        <button (click)="updateDirectDebit()" class="btn btn-success text-white btn-sm">فعالسازی</button>
        } @else if(customerInfo()?.podSsoInfo.expired === true) {
        <button (click)="updateDirectDebit()" class="btn btn-success text-white btn-sm">
          فعالسازی مجدد
          <fa-icon class="mx-1" icon="refresh"></fa-icon>
        </button>
        } @else {
        <span class="d-inline-block text-secondary mx-1">وضعیت: </span>
        <span class="d-inline-block fw-bold mx-1">فعال</span>
        <fa-icon class="mx-1 text-green" icon="check-square"></fa-icon>
        }
      </div>
    </div>
  </div>
</div>
