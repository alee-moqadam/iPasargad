@if(showLoading()){
  <div class="body">
    <div class="loader-content">
      <div class="loading-container">
          <img src="/svg/PCMG-Sign-Sc-Original.svg" class="logo" alt="iPasargad">
          <span class="loader"></span>
      </div>
      <div class="d-flex">
          <div class="loader-container">
              <div class="square"></div>
              <div class="square"></div>
              <div class="square"></div>
          </div>
          <h4 class="loader-text">لطفا منتظر بمانید</h4>
          <div class="loader-container rtl">
              <div class="square"></div>
              <div class="square"></div>
              <div class="square"></div>
          </div>
      </div>
    </div>
  </div>
}
<div ngbAccordion>
  <div ngbAccordionItem class=" mb-3" [collapsed]="isCollapsed1" (shown)="isCollapsed1 = false"
    (hidden)="isCollapsed1 = true">
    <span ngbAccordionHeader style="border-radius: 20px !important;">
      <button class=" d-flex justify-content-between py-5 px-4" ngbAccordionButton>
        <div class="d-flex align-items-center justify-content-between w-100">
          <h5 class="text-secondary">
            تنظیمات سیستمی
          </h5>

        </div>
        <div class="d-flex align-items-center">
          <h5 class="text-primary text-nowrap mb-0">
            نمایش اطلاعات
          </h5>

          <svg class="text-primary me-2" viewBox="0 0 24 24" width="14px" height="14px">
            <use [attr.xlink:href]="isCollapsed1 ? '#ico_drop_down' : '#ico_drop_up'"></use>
          </svg>
        </div>
      </button>
    </span>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody style="background-color: #fff;" (click)="faNumChanges()">
        <ng-template>
          <div class="d-flex justify-content-between">
            <h4>نحوه نمایش اعداد(123)</h4>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" [checked]="faNum()">
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

</div>

@if(showLoginByBiometrics()){
<div ngbAccordion>
  <div ngbAccordionItem class=" mb-3" [collapsed]="isCollapsed2" (shown)="isCollapsed2 = false"
    (hidden)="isCollapsed2 = true">
    <span ngbAccordionHeader style="border-radius: 20px !important;">
      <button class=" d-flex justify-content-between py-5 px-4" ngbAccordionButton>
        <div class="d-flex align-items-center justify-content-between w-100">
          <h5 class="text-secondary">
            تنظیمات سیستمی
          </h5>

        </div>
        <div class="d-flex align-items-center">
          <h5 class="text-primary text-nowrap mb-0">
            نمایش اطلاعات
          </h5>

          <svg class="text-primary me-2" viewBox="0 0 24 24" width="14px" height="14px">
            <use [attr.xlink:href]="isCollapsed2 ? '#ico_drop_down' : '#ico_drop_up'"></use>
          </svg>
        </div>
      </button>
    </span>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody style="background-color: #fff;" (click)="biometricRegister($event)">
        <ng-template>
          <div class="d-flex justify-content-between">
            <h4>فعالسازی ورود با اثر انگشت</h4>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" [checked]="biometricId()">
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

</div>

}
