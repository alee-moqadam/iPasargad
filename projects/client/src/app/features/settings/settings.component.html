<div ngbAccordion>
  <div ngbAccordionItem class=" mb-3" [collapsed]="isCollapsed1" (shown)="isCollapsed1 = false"
    (hidden)="isCollapsed1 = true">
    <span ngbAccordionHeader style="border-radius: 20px !important;">
      <button class=" d-flex justify-content-between py-5 px-4" ngbAccordionButton>
        <div class="d-flex align-items-center justify-content-between w-100">
          <h5 class="text-secondary">
            تنظیمات سیستمی
          </h5>

        </div>
        <div class="d-flex align-items-center">
          <h5 class="text-primary text-nowrap mb-0">
            نمایش اطلاعات
          </h5>

          <svg class="text-primary me-2" viewBox="0 0 24 24" width="14px" height="14px">
            <use [attr.xlink:href]="isCollapsed1 ? '#ico_drop_down' : '#ico_drop_up'"></use>
          </svg>
        </div>
      </button>
    </span>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody style="background-color: #fff;">
        <ng-template>
          <div class="d-flex justify-content-between">
            <h4>نحوه نمایش اعداد(123)</h4>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" (change)="faNumChanges()" [checked]="faNum()">
            </div>
          </div>

        </ng-template>
      </div>
    </div>
  </div>

</div>

<div ngbAccordion>
  <div ngbAccordionItem class=" mb-3" [collapsed]="isCollapsed2" (shown)="isCollapsed2 = false"
    (hidden)="isCollapsed2 = true">
    <span ngbAccordionHeader style="border-radius: 20px !important;">
      <button class=" d-flex justify-content-between py-5 px-4" ngbAccordionButton>
        <div class="d-flex align-items-center justify-content-between w-100">
          <h5 class="text-secondary">
            امنیت
          </h5>

        </div>
        <div class="d-flex align-items-center">
          <h5 class="text-primary text-nowrap mb-0">
            نمایش اطلاعات
          </h5>

          <svg class="text-primary me-2" viewBox="0 0 24 24" width="14px" height="14px">
            <use [attr.xlink:href]="isCollapsed2 ? '#ico_drop_down' : '#ico_drop_up'"></use>
          </svg>
        </div>
      </button>
    </span>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody style="background-color: #fff;">
        <ng-template>
          <app-change-password></app-change-password>
        </ng-template>
      </div>
    </div>
  </div>

</div>
<div ngbAccordion>
  <div ngbAccordionItem class=" mb-3" [collapsed]="isCollapsed3" (shown)="isCollapsed3 = false"
    (hidden)="isCollapsed3 = true">
    <span ngbAccordionHeader style="border-radius: 20px !important;">
      <button class=" d-flex justify-content-between py-5 px-4" ngbAccordionButton>
        <div class="d-flex align-items-center justify-content-between w-100">
          <h5 class="text-secondary">
            امنیت
          </h5>

        </div>
        <div class="d-flex align-items-center">
          <h5 class="text-primary text-nowrap mb-0">
            سابقه ورود و خروج
          </h5>

          <svg class="text-primary me-2" viewBox="0 0 24 24" width="14px" height="14px">
            <use [attr.xlink:href]="isCollapsed3 ? '#ico_drop_down' : '#ico_drop_up'"></use>
          </svg>
        </div>
      </button>
    </span>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody style="background-color: #fff;">
        <ng-template>
          <div class="row p-2 bg-gray-200 justify-content-around align-items-center">
            <div class="col-lg-6">IP</div>
            <div class="col-lg-6">زمان ورود</div>
            <div class="col-lg-6">زمان خروج</div>
            <div class="col-lg-6">نوع</div>
          </div>

          @for (item of history() | slice:0:10; track $index) {
          <div class="card bg-gray-150 my-2">

            <div class="row card-body">
              <div class="col-lg-6 fs-6">{{ item.ip }}</div>
              <div class="col-lg-6 fs-6">{{ item.dateJalali }}</div>
              <div class="col-lg-6 fs-6">{{ item.expireDateJalali }}</div>
              <div class="col-lg-6 fs-6">{{ item.typeDescription }}</div>
            </div>
          </div>
          }
        </ng-template>
      </div>
    </div>
  </div>
</div>
