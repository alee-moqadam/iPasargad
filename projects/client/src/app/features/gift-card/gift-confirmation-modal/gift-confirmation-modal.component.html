<div class="card">
    <div class="card-body">
        <div class="d-flex align-items-center flex-column w-100">
            <img src="/svg/badge-gift-card.svg" style="height: 96px;width: 96px;" class="mb-2">
            <h4 class="text-center text-success fe-bold mb-3">
                عملیات با موفقیت انجام شد!
            </h4>
            <div class="d-flex align-items-center justify-content-between custom-dashed-border w-100 mb-3 px-3 py-4">
                <h5 class="mb-0" style="color: #5C6670;">
                    کد رهگیری
                </h5>
                <h4 class="mb-0 fw-bold" style="color: #2F3742;">
                    {{giftCardInfo?.ticketNumber}}
                </h4>

            </div>
            <div class="d-flex align-items-center justify-content-between custom-dashed-border w-100 mb-3 px-3 py-4">
                <h5 class="mb-0" style="color: #5C6670;">
                    نام صندوق
                </h5>
                <h4 class="mb-0 fw-bold" style="color: #2F3742;">
                    {{giftCardInfo?.mutualFundTitle}}

                </h4>

            </div>
            <div class="d-flex align-items-center justify-content-between custom-dashed-border w-100 mb-3 px-3 py-4">
                <h5 class="mb-0" style="color: #5C6670;">
                    مبلغ
                </h5>
                <h4 class="mb-0 fw-bold d-flex align-items-center" style="color: #2F3742;">
                    {{giftCardInfo?.amount | number}}

                    <h6 class="mb-0 me-1" style="color: #818D98">
                        ریال
                    </h6>
                </h4>

            </div>
            <div class="d-flex align-items-center justify-content-between custom-dashed-border w-100 mb-3 px-3 py-4">
                <h5 class="mb-0" style="color: #5C6670;direction: ltr;">
                    تاریخ
                </h5>
                <h4 class="mb-0 fw-bold text-center w-100" style="color: #2F3742;">
                    <div class="w-100 text-start mb-2">
                        {{giftCardInfo?.createdJalali.split(' ')[0] }}
                    </div>
                    <div class="w-100 text-start">
                        {{giftCardInfo?.createdJalali.split(' ')[1] }}
                    </div>

                </h4>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3 w-100">
              <textarea rows="10" readonly class="w-100 custom-dashed-border p-3 text-justify" [value]="message" #msgBox>{{ message }}</textarea>
            </div>
            <div class="d-flex align-items-center justify-content-between w-100">
                <button class="btn flex-fill border-radius-15 text-black " routerLink='/dashboard'
                    style="background-color: #E0E6EB;" (click)="activeModal.dismiss()">پیشخوان</button>
                <button class="btn btn-primary flex-fill border-radius-15 text-white me-2"
                    routerLink='/reporting/requests' (click)="activeModal.dismiss()">گزارش درخواست</button>
            </div>
        </div>
    </div>
</div>
